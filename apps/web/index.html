<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GraphCraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #666;
  --accent: #1f77b4;
  --panel: #f7f7f7;
  --panel-2: #ececec;
  --border: #d0d0d0;
  --error: #b22222;
  --stale: #d78a00;
  --fresh: #2ca02c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141414;
    --fg: #ededed;
    --muted: #999;
    --panel: #1e1e1e;
    --panel-2: #262626;
    --border: #333;
    --accent: #4ea8de;
    --error: #ff7979;
    --stale: #e7b94c;
    --fresh: #6abf6a;
  }
}
:root[data-theme="dark"] {
  --bg: #141414; --fg: #ededed; --muted: #999;
  --panel: #1e1e1e; --panel-2: #262626; --border: #333;
  --accent: #4ea8de; --error: #ff7979;
  --stale: #e7b94c; --fresh: #6abf6a;
}
html, body { background: var(--bg); color: var(--fg); margin: 0;
  font-family: system-ui, sans-serif; height: 100%; }
body { display: grid; grid-template-rows: auto 1fr; }

/* Top bar */
header { padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; }
header h1 { margin: 0; font-size: 18px; }
header input[type="text"] { background: var(--panel); color: var(--fg);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font-size: 13px; }
header .spacer { flex: 1; }
header button, header label.btn, .controls button {
  background: var(--accent); color: white; border: 0; padding: 5px 10px;
  border-radius: 6px; cursor: pointer; font-size: 13px; }
header button.ghost, .controls button.ghost {
  background: transparent; color: var(--fg); border: 1px solid var(--border); }
#file-input { display: none; }

/* Main split */
main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }
@media (max-width: 720px) { main { grid-template-columns: 1fr; } }
aside { border-right: 1px solid var(--border); background: var(--panel);
  padding: 10px; overflow: auto; }
aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); margin: 12px 0 4px; }
.sheet-list { list-style: none; padding: 0; margin: 0; }
.sheet-list li { padding: 5px 8px; border-radius: 4px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; font-size: 13px; }
.sheet-list li:hover { background: var(--panel-2); }
.sheet-list li.active { background: var(--accent); color: white; }
.sheet-list li.active .muted { color: #eef; }
.sheet-list li .dot { width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0; }
.sheet-list li .dot.fresh { background: var(--fresh); }
.sheet-list li .dot.stale { background: var(--stale); }
.sheet-list li .dot.unknown { background: var(--muted); }
.sheet-list li .label { flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.add-btn { background: transparent; border: 1px dashed var(--border);
  color: var(--muted); padding: 4px 8px; width: 100%; margin-top: 4px;
  border-radius: 4px; cursor: pointer; font-size: 12px; }
.add-btn:hover { color: var(--fg); border-color: var(--fg); }

/* Detail pane */
section#detail { padding: 16px; overflow: auto; min-width: 0; }
section#detail .title-row { display: flex; align-items: baseline;
  gap: 10px; margin-bottom: 10px; }
section#detail h2 { margin: 0; font-size: 18px; }
section#detail .meta { color: var(--muted); font-size: 12px; }
section#detail .status-pill { display: inline-block; padding: 2px 8px;
  border-radius: 10px; font-size: 11px; }
.status-pill.fresh { background: var(--fresh); color: white; }
.status-pill.stale { background: var(--stale); color: white; }
.status-pill.unknown { background: var(--panel-2); color: var(--muted); }
.controls { display: flex; gap: 8px; margin: 8px 0 14px; flex-wrap: wrap; }
.result { background: var(--panel); padding: 12px; border-radius: 6px;
  overflow: auto; }
.result pre { margin: 0; font-family: ui-monospace, monospace; font-size: 12px;
  white-space: pre-wrap; }
table.data-grid { border-collapse: collapse; font-family: ui-monospace, monospace;
  font-size: 12px; }
table.data-grid th { background: var(--panel-2); padding: 4px 10px;
  border: 1px solid var(--border); text-align: left; }
table.data-grid td { padding: 2px 10px; border: 1px solid var(--border); }
.svg-wrap { background: white; border-radius: 6px; padding: 4px; overflow: auto; }

/* Modal */
dialog { border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); color: var(--fg); padding: 0; max-width: 90vw; }
dialog::backdrop { background: rgba(0,0,0,0.4); }
dialog form { padding: 16px; display: flex; flex-direction: column;
  gap: 10px; min-width: 360px; }
dialog label { display: flex; flex-direction: column; gap: 4px;
  font-size: 12px; color: var(--muted); }
dialog input, dialog select, dialog textarea {
  background: var(--panel); color: var(--fg); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 13px; }
dialog textarea { font-family: ui-monospace, monospace; min-height: 140px; }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
.error { color: var(--error); font-weight: 600; }
.hint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>GraphCraft</h1>
  <input id="project-title" type="text" placeholder="Project title" />
  <span class="spacer"></span>
  <span id="status" class="meta">loading WASM…</span>
  <button id="btn-save" class="ghost">Save .graphcraft</button>
  <label class="btn ghost" for="file-input">Open .graphcraft</label>
  <input id="file-input" type="file" accept=".graphcraft,application/json,text/plain" />
  <button id="btn-recompute-all" class="ghost">Recompute all</button>
</header>

<main>
  <aside>
    <h2>Data</h2>
    <ul id="list-data" class="sheet-list"></ul>
    <button class="add-btn" id="btn-add-data">+ Data from CSV</button>

    <h2>Analyses</h2>
    <ul id="list-analysis" class="sheet-list"></ul>
    <button class="add-btn" id="btn-add-analysis">+ New analysis</button>

    <h2>Graphs</h2>
    <ul id="list-graph" class="sheet-list"></ul>
    <button class="add-btn" id="btn-add-graph">+ New graph</button>
  </aside>

  <section id="detail">
    <p class="meta">Select or add a sheet to begin.</p>
  </section>
</main>

<!-- Modals -->
<dialog id="dlg-data">
  <form method="dialog">
    <h3 style="margin:0">Add data from CSV</h3>
    <label>Title <input name="title" required value="Imported data" /></label>
    <label>CSV
      <textarea name="csv" required>a,b
1,10
2,20
3,30
4,40
5,50</textarea>
    </label>
    <div class="buttons">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="ok">Add</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-analysis">
  <form method="dialog">
    <h3 style="margin:0">Add analysis</h3>
    <label>Source data sheet
      <select name="source" required></select>
    </label>
    <label>Kind
      <select name="kind" required>
        <option value="descriptives">Descriptives</option>
        <option value="one-way-anova">One-way ANOVA</option>
        <option value="welch-t">Welch's t-test</option>
        <option value="pearson">Pearson correlation</option>
        <option value="ols-regression">OLS regression</option>
        <option value="shapiro-wilk">Shapiro-Wilk normality</option>
      </select>
    </label>
    <div id="analysis-params"></div>
    <div class="buttons">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="ok">Add</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-graph">
  <form method="dialog">
    <h3 style="margin:0">Add graph</h3>
    <label>Source data sheet
      <select name="source" required></select>
    </label>
    <label>Kind
      <select name="kind" required>
        <option value="xy">XY scatter</option>
        <option value="column">Column plot</option>
        <option value="heatmap">Heatmap</option>
      </select>
    </label>
    <div id="graph-params"></div>
    <div class="buttons">
      <button value="cancel" class="ghost">Cancel</button>
      <button value="ok">Add</button>
    </div>
  </form>
</dialog>

<script type="module">
import init, * as wasm from './pkg/graphcraft_web.js';

let state = { active: null };

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function summary() { return JSON.parse(wasm.project_summary()); }
function detail(id) { return JSON.parse(wasm.sheet_detail(BigInt(id))); }

function render() {
  const s = summary();
  document.getElementById('project-title').value = s.title;
  const data = s.sheets.filter(x => x.kind === 'data');
  const ana  = s.sheets.filter(x => x.kind === 'analysis');
  const grp  = s.sheets.filter(x => x.kind === 'graph');
  renderList('list-data', data);
  renderList('list-analysis', ana);
  renderList('list-graph', grp);
  if (state.active && !s.sheets.find(x => x.id === state.active)) {
    state.active = null;
  }
  renderDetail();
}

function renderList(id, sheets) {
  const ul = document.getElementById(id);
  ul.innerHTML = '';
  for (const s of sheets) {
    const li = document.createElement('li');
    if (state.active === s.id) li.classList.add('active');
    li.innerHTML = `
      <span class="dot ${s.status}" title="${s.status}"></span>
      <span class="label">${escapeHtml(s.title)}</span>`;
    li.onclick = () => { state.active = s.id; render(); };
    ul.appendChild(li);
  }
}

function renderDetail() {
  const el = document.getElementById('detail');
  if (!state.active) {
    el.innerHTML = '<p class="meta">Select or add a sheet to begin.</p>';
    return;
  }
  const d = detail(state.active);
  if (d.error) {
    el.innerHTML = `<p class="error">${escapeHtml(d.error)}</p>`;
    return;
  }
  const statusPill = `<span class="status-pill ${d.status}">${d.status}</span>`;
  const titleRow = `<div class="title-row"><h2>${escapeHtml(d.title)}</h2>${statusPill}
    <span class="meta">(${d.kind}${d.source ? ' from sheet ' + d.source : ''})</span></div>`;
  const controls = d.kind === 'data' ? '' : `
    <div class="controls">
      <button onclick="window.gc.recompute(${d.id})">Recompute</button>
      <button class="ghost" onclick="window.gc.deleteSheet(${d.id})">Delete</button>
    </div>`;
  const deleteOnlyControls = d.kind === 'data' ? `
    <div class="controls">
      <button class="ghost" onclick="window.gc.deleteSheet(${d.id})">Delete</button>
    </div>` : '';
  let body;
  if (d.kind === 'data') {
    body = renderDataGrid(d);
  } else if (d.kind === 'analysis') {
    body = `<div class="result"><pre>${escapeHtml(JSON.stringify(d.result, null, 2))}</pre></div>`;
  } else if (d.kind === 'graph') {
    body = d.svg
      ? `<div class="svg-wrap">${d.svg}</div>`
      : `<p class="error">couldn't build scene: ${escapeHtml(d.error || 'unknown')}</p>`;
  }
  el.innerHTML = titleRow + (d.kind === 'data' ? deleteOnlyControls : controls) + body;
}

function renderDataGrid(d) {
  const t = d.table && d.table.table ? d.table.table : d.table;
  if (!t || !t.columns) return '<p class="meta">(non-column data table)</p>';
  const header = t.columns.map(c => `<th>${escapeHtml(c.title)}</th>`).join('');
  const nRows = d.n_rows || 0;
  const maxShown = 50;
  const rows = [];
  for (let i = 0; i < Math.min(nRows, maxShown); i++) {
    const cells = t.columns.map(c => {
      const v = c.values[i];
      return `<td>${v === null || v === undefined ? '' : v}</td>`;
    }).join('');
    rows.push(`<tr>${cells}</tr>`);
  }
  const extra = nRows > maxShown
    ? `<p class="hint">… ${nRows - maxShown} more rows not shown</p>` : '';
  return `<table class="data-grid"><thead><tr>${header}</tr></thead>
    <tbody>${rows.join('')}</tbody></table>${extra}`;
}

// Modal helpers
function populateSources(sel) {
  const s = summary();
  const data = s.sheets.filter(x => x.kind === 'data');
  sel.innerHTML = data.map(d =>
    `<option value="${d.id}">${escapeHtml(d.title)} (#${d.id})</option>`
  ).join('');
}

function renderAnalysisParams(kind) {
  const paramsHtml = {
    'descriptives': '',
    'one-way-anova': '',
    'welch-t':
      `<label>Column a <input name="a" required placeholder="header or index" /></label>
       <label>Column b <input name="b" required placeholder="header or index" /></label>`,
    'pearson':
      `<label>Column a <input name="a" required /></label>
       <label>Column b <input name="b" required /></label>`,
    'ols-regression':
      `<label>x (predictor) <input name="x" required /></label>
       <label>y (response) <input name="y" required /></label>`,
    'shapiro-wilk':
      `<label>Column <input name="col" required /></label>`,
  }[kind] || '';
  document.getElementById('analysis-params').innerHTML = paramsHtml;
}

function renderGraphParams(kind) {
  const paramsHtml = {
    'xy':
      `<label>x column <input name="x" required /></label>
       <label>y column <input name="y" required /></label>`,
    'column': `<label>Error bars
      <select name="error_bars">
        <option value="sd" selected>SD</option>
        <option value="sem">SEM</option>
        <option value="none">None</option>
      </select></label>`,
    'heatmap': `<label>Colormap
      <select name="colormap">
        <option value="diverging-blue-red" selected>Blue → red</option>
        <option value="grayscale">Grayscale</option>
        <option value="sequential-blue">Sequential blue</option>
      </select></label>`,
  }[kind] || '';
  document.getElementById('graph-params').innerHTML = paramsHtml;
}

// Public actions
window.gc = {
  recompute(id) {
    const r = JSON.parse(wasm.recompute(BigInt(id)));
    if (r.error) alert(r.error);
    render();
  },
  deleteSheet(id) {
    if (!confirm('Delete this sheet?')) return;
    wasm.delete_sheet(BigInt(id));
    if (state.active === id) state.active = null;
    render();
  },
};

(async () => {
  await init();
  document.getElementById('status').textContent = 'WASM v' + wasm.graphcraft_version();

  document.getElementById('project-title').onchange = e => {
    wasm.project_set_title(e.target.value);
  };

  document.getElementById('btn-save').onclick = () => {
    const text = wasm.project_save();
    const title = summary().title || 'project';
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = title.replace(/[^a-z0-9_-]+/gi, '_') + '.graphcraft';
    a.click();
    URL.revokeObjectURL(url);
  };

  document.getElementById('file-input').onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    const text = await f.text();
    const r = JSON.parse(wasm.project_load(text));
    if (r.error) alert(r.error);
    state.active = null;
    render();
  };

  document.getElementById('btn-recompute-all').onclick = () => {
    const r = JSON.parse(wasm.recompute_all());
    document.getElementById('status').textContent = `refreshed ${r.refreshed} sheets`;
    render();
  };

  // Add data
  const dlgData = document.getElementById('dlg-data');
  document.getElementById('btn-add-data').onclick = () => dlgData.showModal();
  dlgData.addEventListener('close', () => {
    if (dlgData.returnValue !== 'ok') return;
    const form = dlgData.querySelector('form');
    const title = form.title.value;
    const csv = form.csv.value;
    const r = JSON.parse(wasm.add_data_from_csv(title, csv));
    if (r.error) { alert(r.error); return; }
    state.active = Number(r.id);
    render();
  });

  // Add analysis
  const dlgAna = document.getElementById('dlg-analysis');
  document.getElementById('btn-add-analysis').onclick = () => {
    populateSources(dlgAna.querySelector('[name=source]'));
    renderAnalysisParams(dlgAna.querySelector('[name=kind]').value);
    dlgAna.showModal();
  };
  dlgAna.querySelector('[name=kind]').onchange = e => renderAnalysisParams(e.target.value);
  dlgAna.addEventListener('close', () => {
    if (dlgAna.returnValue !== 'ok') return;
    const form = dlgAna.querySelector('form');
    const source = Number(form.source.value);
    const kind = form.kind.value;
    const spec = { kind };
    for (const el of form.querySelectorAll('#analysis-params [name]')) {
      spec[el.name] = el.value;
    }
    const r = JSON.parse(wasm.add_analysis(BigInt(source), JSON.stringify(spec)));
    if (r.error) { alert(r.error); return; }
    state.active = Number(r.id);
    render();
  });

  // Add graph
  const dlgGraph = document.getElementById('dlg-graph');
  document.getElementById('btn-add-graph').onclick = () => {
    populateSources(dlgGraph.querySelector('[name=source]'));
    renderGraphParams(dlgGraph.querySelector('[name=kind]').value);
    dlgGraph.showModal();
  };
  dlgGraph.querySelector('[name=kind]').onchange = e => renderGraphParams(e.target.value);
  dlgGraph.addEventListener('close', () => {
    if (dlgGraph.returnValue !== 'ok') return;
    const form = dlgGraph.querySelector('form');
    const source = Number(form.source.value);
    const kind = form.kind.value;
    const spec = { kind, title: null };
    for (const el of form.querySelectorAll('#graph-params [name]')) {
      spec[el.name] = el.value;
    }
    const r = JSON.parse(wasm.add_graph(BigInt(source), JSON.stringify(spec)));
    if (r.error) { alert(r.error); return; }
    state.active = Number(r.id);
    render();
  });

  render();
})();
</script>
</body>
</html>
