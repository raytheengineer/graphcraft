<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GraphCraft</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
      background: #141414; color: #ededed; font-family: system-ui, sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #boot { position: absolute; inset: 0; display: flex; align-items: center;
      justify-content: center; color: #999; font-size: 14px; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="gc-canvas"></canvas>
  <div id="boot">loading WASM…</div>
  <script type="module">
    import init, { start } from './pkg/graphcraft_web.js';
    (async () => {
      await init();
      document.getElementById('boot').remove();
      await start('gc-canvas');
    })().catch(e => {
      document.getElementById('boot').textContent = 'failed to start: ' + e;
    });
  </script>
</body>
</html>
